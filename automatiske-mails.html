<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatiske mails til donor</title>
<style>
body{margin:0;background:#f7f7f7;color:#373538;font-family:Gotham,Verdana,sans-serif;font-size:16px;line-height:24px}
a{color:#e30a0b}a:hover{color:#aa0a0b}
.side{max-width:1280px;margin:0 auto;padding:40px 16px 64px;box-sizing:border-box}
.side h1{margin:0 0 32px;font-size:32px;line-height:36px;font-weight:700}
.mails{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:40px 32px;align-items:start}
.mail{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.mail figcaption{width:100%;max-width:600px;font-size:14px;line-height:22px;font-weight:700}
.mail table{box-shadow:0 1px 3px rgba(55,53,56,.12)}
@media (max-width:480px){.mail .indhold{padding:24px 20px 8px!important}.mail .bund{padding:20px!important}}
@media (min-width:768px){.side{padding:64px 24px 96px}}
</style>
</head>
<body>
<main class="side">
<h1>Automatiske mails til donor</h1>
<div class="mails">

<figure class="mail">
<figcaption>Ved accept – besked til donor</figcaption>
<!-- MAIL: accept -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; border-collapse: collapse; background: #ffffff; font-family: Gotham, Verdana, sans-serif; color: #373538">
<tr>
<td align="center" style="padding: 20px 0; background: #fef5f5"><svg width="44" height="44" viewBox="0 0 68 68" role="img" aria-label="Røde Kors"><path d="M22 0h24v22h22v24H46v22H22V46H0V22h22z" fill="#e30a0b"></path></svg></td>
</tr>
<tr>
<td class="indhold" style="padding: 32px 32px 8px; font-size: 16px; line-height: 24px">
<p style="margin: 0 0 16px; font-size: 21px; line-height: 26px; font-weight: 700">Mange tak for at du vil donere til os.</p>
<p style="margin: 0 0 16px">Vi har gennemgået dit tilbud og vi kan bruge hele donationen. Vi vil med glæde modtage/afhente denne.</p>
<p style="margin: 0 0 16px">Vores chauffør kontakter dig snarest, for aftale om indlevering/afhentning.</p>
<p style="margin: 0 0 16px">Vores chauffør ringer eller sms'er typisk til dig.</p>
<p style="margin: 0 0 24px">Se gerne de <a href="https://www.rodekors.dk/genbrug/doner" style="color: #e30a0b">generelle vejledninger for donationer</a>.</p>
</td>
</tr>
<tr>
<td class="bund" style="padding: 24px 32px; background: #f7f7f7; font-size: 14px; line-height: 22px">
<p style="margin: 0 0 16px">GivVidere gør det nemt at give videre. Din donation går ubeskåret til lokale sociale indsatser og genbrugsprojekter.</p>
<p style="margin: 0; padding-top: 16px; border-top: 1px solid #e7e5e7"><strong>Røde Kors</strong> · Blegdamsvej 27, 2100 København Ø<br><a href="mailto:info@rodekors.dk" style="color: #373538">info@rodekors.dk</a> · <a href="tel:+4535259200" style="color: #373538">+45 35 25 92 00</a></p>
</td>
</tr>
</table>
<!-- /MAIL -->
</figure>

<figure class="mail">
<figcaption>Ved afvisning – besked til donor</figcaption>
<!-- MAIL: afvisning -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; border-collapse: collapse; background: #ffffff; font-family: Gotham, Verdana, sans-serif; color: #373538">
<tr>
<td align="center" style="padding: 20px 0; background: #fef5f5"><svg width="44" height="44" viewBox="0 0 68 68" role="img" aria-label="Røde Kors"><path d="M22 0h24v22h22v24H46v22H22V46H0V22h22z" fill="#e30a0b"></path></svg></td>
</tr>
<tr>
<td class="indhold" style="padding: 32px 32px 8px; font-size: 16px; line-height: 24px">
<p style="margin: 0 0 16px; font-size: 21px; line-height: 26px; font-weight: 700">Mange tak for dit tilbud om donation.</p>
<p style="margin: 0 0 16px">Vi har nu gennemgået dit tilbud og må desværre sige pænt nej tak denne gang.</p>
<p style="margin: 0 0 16px">Der kan ligge flere forskellige forhold bag vores vurdering, se gerne <a href="https://www.rodekors.dk/genbrug/doner" style="color: #e30a0b">generelle vejledninger for donationer</a>.</p>
<p style="margin: 0 0 24px">Vi takker dig for at du valgte at kontakte Røde Kors og håber du vil kontakte os hvis der skulle komme en anden anledning.</p>
</td>
</tr>
<tr>
<td class="bund" style="padding: 24px 32px; background: #f7f7f7; font-size: 14px; line-height: 22px">
<p style="margin: 0 0 16px">GivVidere gør det nemt at give videre. Din donation går ubeskåret til lokale sociale indsatser og genbrugsprojekter.</p>
<p style="margin: 0; padding-top: 16px; border-top: 1px solid #e7e5e7"><strong>Røde Kors</strong> · Blegdamsvej 27, 2100 København Ø<br><a href="mailto:info@rodekors.dk" style="color: #373538">info@rodekors.dk</a> · <a href="tel:+4535259200" style="color: #373538">+45 35 25 92 00</a></p>
</td>
</tr>
</table>
<!-- /MAIL -->
</figure>

</div>
</main>
</body>
</html>
